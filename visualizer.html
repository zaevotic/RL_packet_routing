<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RL Packet Routing Visualizer & Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--ink:#121212;--mute:#77777f;--line:#e3e3e6;--edge:#cfcfd4;--acc:#1f3dff;--bad:#e5322d;--good:#10b981;--warn:#f59e0b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--ink:#f2f2f3;--mute:#8b8b93;--line:#26262b;--edge:#35353c;--acc:#7189ff;--bad:#ff5b55;--good:#34d399;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e10;--ink:#f2f2f3;--mute:#8b8b93;--line:#26262b;--edge:#35353c;--acc:#7189ff;--bad:#ff5b55;--good:#34d399;--warn:#fbbf24;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 "Schibsted Grotesk",system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 340px}

/* Header & Tabs */
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:36px}
h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
h1 span{color:var(--mute);font-weight:400}
.tabs{display:flex;gap:20px}
.tabs button{padding:4px 0;color:var(--mute);border-bottom:2px solid transparent;font-weight:500;transition:color .15s, border-color .15s}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink);font-weight:600}
nav{display:flex;gap:20px}
nav button{padding:4px 0;border-bottom:1px solid transparent;color:var(--mute);transition:color .15s,border-color .15s}
nav button:hover{color:var(--ink);border-color:var(--ink)}

/* View switching */
.app[data-view=analytics] main,.app[data-view=analytics] aside,.app[data-view=analytics] footer{display:none}
.app[data-view=replay] #analytics{display:none}

/* Main Replay Area */
main{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0}
.stats{display:flex;gap:48px;padding:24px 32px 8px}
.stat b{display:block;font-size:32px;font-weight:500;letter-spacing:-.03em;line-height:1}
.stat small{display:block;margin-top:6px;color:var(--mute);font-size:12px}
.stat.d b{color:var(--acc)}.stat.x b{color:var(--bad)}
.stage{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--mute);gap:6px}
.empty button{color:var(--ink);border-bottom:1px solid var(--ink)}
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h2{font-size:12px;font-weight:600;color:var(--mute);padding:18px 20px 10px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:0.04em}
#log{list-style:none;padding:0 16px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px}

/* Grouped Event Stream Cards */
.time-card{
 background:rgba(255,255,255,0.03);
 border:1px solid var(--line);
 border-left:3px solid var(--acc);
 border-radius:8px;
 padding:9px 12px;
 font-size:12.5px;
 display:flex;
 flex-direction:column;
 gap:6px;
 transition:border-color 0.15s, background 0.15s;
}
.time-card:hover{
 background:rgba(255,255,255,0.06);
 border-color:var(--edge);
}
.time-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:11px;
 font-weight:600;
 text-transform:uppercase;
 letter-spacing:0.04em;
 color:var(--mute);
 border-bottom:1px solid var(--line);
 padding-bottom:4px;
}
.time-head time{ color:var(--acc); font-weight:700; font-size:12px; }
.time-head .badge{ font-size:10px; padding:1px 6px; border-radius:10px; background:var(--line); color:var(--ink); }

.cat-row{ display:flex; align-items:baseline; gap:8px; line-height:1.4; }
.cat-tag{
 font-size:10.5px;
 font-weight:700;
 text-transform:uppercase;
 letter-spacing:0.03em;
 padding:1px 5px;
 border-radius:4px;
 flex-shrink:0;
}
.cat-tag.spawn{ background:rgba(56,189,248,0.15); color:var(--acc); }
.cat-tag.hop{ background:rgba(148,163,184,0.15); color:var(--ink); }
.cat-tag.deliver{ background:rgba(16,185,129,0.15); color:var(--good); }
.cat-tag.drop{ background:rgba(244,63,94,0.15); color:var(--bad); }

.cat-desc{ color:var(--ink); flex:1; word-break:break-word; }
.cat-desc .pkt{ font-weight:600; cursor:pointer; padding:0 2px; }
.cat-desc .pkt:hover{ text-decoration:underline; }

/* Replay Controls Footer */
footer{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:14px 28px;border-top:1px solid var(--line)}
.ctl{display:flex;gap:4px}
.ctl button{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;transition:background .15s}
.ctl button:hover{background:var(--line)}
.ctl .go{background:var(--ink);color:var(--bg)}.ctl .go:hover{background:var(--ink);opacity:.85}
.ctl svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ctl .go svg{fill:currentColor;stroke:none}
.lbl{color:var(--mute);min-width:60px;font-size:13px}
input[type=range]{flex:1;appearance:none;-webkit-appearance:none;height:20px;background:none;cursor:pointer;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--edge)}
input[type=range]::-moz-range-track{height:2px;background:var(--edge)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink);margin-top:-5px;border:0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:0}
select{padding:4px 0;color:var(--mute);font-size:13px}

/* ======================================================================
   ANALYTICS STYLES
   ====================================================================== */
#analytics{grid-column:1/-1;grid-row:2;overflow-y:auto;min-height:0;padding:32px}
.an{max-width:1240px;margin:0 auto}
.an-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.an-head h2{font-size:22px;font-weight:500;letter-spacing:-.02em}
.src{display:flex;gap:20px;color:var(--mute);font-size:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:28px;margin-bottom:48px}
.group{margin-bottom:44px}
.group>h3{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.group>h3 .sub{font-size:12px;font-weight:400;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:28px 36px}
.panel{border-top:1px solid var(--line);padding-top:14px;min-width:0}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s12{grid-column:span 12}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:12px}
.ph h4{font-size:13px;font-weight:500}
.ph code{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute);text-align:right}
svg.ch{display:block;width:100%;height:auto;overflow:visible}
.ch .gl{stroke:var(--line);stroke-width:1}
.ch .tx{fill:var(--mute);font-size:8px}
.ch .ln{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.lg{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--mute)}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.none{color:var(--mute);font-size:13px;padding:24px 0}
.hb{display:grid;grid-template-columns:130px 1fr 64px;gap:12px;align-items:center;padding:5px 0;font-size:13px}
.hb i{display:block;height:4px;background:var(--edge);min-width:1px;border-radius:2px}
.hb.me i{background:var(--acc)}
.hb.upcoming i{background:var(--warn);opacity:0.6}
.hb b{font-weight:400;text-align:right}
.hb span{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw{overflow:auto;max-height:360px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,0.015)}
.tw table{width:100%;border-collapse:collapse;font-size:13px}
.tw thead th{position:sticky;top:0;background:var(--bg);z-index:2;box-shadow:0 1px 0 var(--line);font-weight:600;color:var(--ink);text-align:left;padding:8px 16px;white-space:nowrap}
.tw tbody td{padding:8px 16px;border-top:1px solid var(--line);white-space:nowrap}
.tw tbody tr:hover{background:rgba(127,127,127,0.05)}
.tw::-webkit-scrollbar{width:6px;height:6px}
.tw::-webkit-scrollbar-track{background:transparent}
.tw::-webkit-scrollbar-thumb{background:var(--edge);border-radius:3px}
td.deliver{color:var(--good);font-weight:500}td.drop{color:var(--bad);font-weight:500}td.live{color:var(--mute)}
pre{font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute);overflow:auto;background:rgba(255,255,255,0.02);padding:14px;border-radius:6px;border:1px solid var(--line)}

@media (max-width:1100px){.s3{grid-column:span 6}.s4{grid-column:span 6}}
@media (max-width:860px){
 body{overflow:auto}.app{height:auto;min-height:100%;grid-template-columns:1fr}
 header{padding:14px 18px;flex-wrap:wrap;gap:12px}.brand{gap:16px;flex-wrap:wrap}nav{gap:14px}
 .stats{padding:18px;gap:24px;flex-wrap:wrap}.stat b{font-size:26px}
 .stage{height:52vh}aside{border-left:0;border-top:1px solid var(--line);max-height:280px}
 footer{padding:12px 18px;flex-wrap:wrap}footer .lbl{display:none}input[type=range]{order:3;flex-basis:100%}
 #analytics{padding:20px}.grid .panel{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="app" data-view="replay">
<header>
 <div class="brand">
  <h1>RL Packet Routing <span>Visualizer</span></h1>
  <div class="tabs" role="tablist">
   <button id="tabR" role="tab" aria-selected="true">Replay</button>
   <button id="tabA" role="tab" aria-selected="false">Analytics</button>
  </div>
 </div>
 <nav>
  <button id="demo">Demo trace</button>
  <button id="upload">Upload trace.json</button>
  <button id="mbtn" hidden>Upload metrics.json</button>
  <input id="file" type="file" accept=".json,.jsonl,.txt,application/json" hidden>
  <input id="mfile" type="file" accept=".json,application/json" hidden>
 </nav>
</header>
<main>
 <div class="stats">
  <div class="stat"><b id="sTime">0</b><small>Sim time</small></div>
  <div class="stat"><b id="sFlight">0</b><small>In flight</small></div>
  <div class="stat d"><b id="sDel">0</b><small>Delivered</small></div>
  <div class="stat x"><b id="sDrop">0</b><small>Dropped</small></div>
  <div class="stat"><b id="sTot">0</b><small>Total packets</small></div>
 </div>
 <div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="empty" id="empty"><span>No trace loaded.</span><span><button id="demo2">Run the demo</button> or upload a trace.json.</span></div>
 </div>
</main>
<aside>
 <h2>Simultaneous Stream <span id="count">0 frames</span></h2>
 <ul id="log"><li class="time-card" style="border-left-color:var(--mute)"><div class="cat-desc" style="color:var(--mute)">Ready. Load or fetch a trace.json to start.</div></li></ul>
</aside>
<section id="analytics" aria-label="Analytics"><div class="an" id="an"></div></section>
<footer>
 <div class="ctl">
  <button id="back" aria-label="Previous frame"><svg viewBox="0 0 16 16"><path d="M10.5 3 5.5 8l5 5"/></svg></button>
  <button id="play" class="go" aria-label="Play"><svg viewBox="0 0 16 16"><path d="M5 3v10l8-5z"/></svg></button>
  <button id="fwd" aria-label="Next frame"><svg viewBox="0 0 16 16"><path d="m5.5 3 5 5-5 5"/></svg></button>
  <button id="reset" aria-label="Reset"><svg viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v3h3"/></svg></button>
 </div>
 <span class="lbl" id="stepL">Frame 0</span>
 <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Scrub through simulation">
 <span class="lbl" id="stepR" style="text-align:right">Frame 0</span>
 <select id="speed" aria-label="Playback speed">
  <option value="0.5">0.5× speed</option><option value="1" selected>1× speed</option><option value="2">2× speed</option><option value="4">4× speed</option>
 </select>
</footer>
</div>
<script>
var $=function(s){return document.querySelector(s)};
var trace=null,frameIdx=0,playing=false,speed=1,lastChange=0,S={},total=0,hoveredPacket=null;
var cv=$("#cv"),ctx=cv.getContext("2d"),W=0,H=0,dpr=1;
var ICON_PLAY='<svg viewBox="0 0 16 16"><path d="M5 3v10l8-5z"/></svg>',ICON_PAUSE='<svg viewBox="0 0 16 16"><path d="M4.5 3h2.5v10H4.5zM9 3h2.5v10H9z"/></svg>';
var LET="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

// Harmonious distinctive hues for packet trails
var HUES = [225, 190, 275, 335, 35, 155, 210, 290, 48, 175, 250, 15];
function getPacketColor(p, alpha){
 var h = HUES[Math.abs(p) % HUES.length];
 var isDark = document.documentElement.getAttribute("data-theme") === "dark" ||
              (!document.documentElement.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme:dark)").matches);
 var s = isDark ? "88%" : "82%";
 var l = isDark ? "66%" : "44%";
 return "hsla(" + h + "," + s + "," + l + "," + (alpha != null ? alpha : 1) + ")";
}

function nm(n){
 if(!trace||!trace.nodes||n==null)return n;
 if(trace.nodes[n]&&trace.nodes[n].label)return trace.nodes[n].label;
 if(typeof n==="number"&&n>=0&&n<LET.length)return LET[n];
 return n;
}

function makeDemo(){
 var nodes=[[.4,.45],[.45,.3],[.45,.65],[.52,.45],[.6,.25],[.6,.7],[.68,.45],[.78,.3],[.78,.65],[.85,.45]].map(function(p,i){return{id:i,x:p[0],y:p[1]}});
 var edges=[[0,1],[0,2],[1,3],[2,3],[1,4],[2,5],[3,4],[3,5],[3,6],[4,6],[5,6],[4,7],[5,8],[6,7],[6,8],[7,9],[8,9]];
 var adj=nodes.map(function(){return[]});edges.forEach(function(e){adj[e[0]].push(e[1]);adj[e[1]].push(e[0])});
 var s=7;function r(){s=(s*1664525+1013904223)%4294967296;return s/4294967296}
 var ev=[];
 for(var p=0;p<16;p++){
  var a=r()<.5?[0,1,2][Math.floor(r()*3)]:[7,8,9][Math.floor(r()*3)],b;
  do{b=Math.floor(r()*10)}while(b===a||Math.abs(nodes[a].x-nodes[b].x)<.3);
  var prev={};prev[a]=-1;var q=[a];
  while(q.length){var u=q.shift();if(u===b)break;adj[u].slice().sort(function(){return r()-.5}).forEach(function(v){if(!(v in prev)){prev[v]=u;q.push(v)}})}
  var path=[];for(var c=b;c!==-1;c=prev[c])path.unshift(c);
  var t0=Math.floor(r()*14), dropAt=r()<.18?1+Math.floor(r()*(path.length-1)):-1;
  ev.push({t:t0,type:"spawn",p:p,node:a});
  for(var i=1;i<path.length;i++){
   if(dropAt===i){ev.push({t:t0+i*2,type:"drop",p:p,node:path[i-1]});break}
   ev.push({t:t0+i*2,type:"hop",p:p,from:path[i-1],to:path[i]});
   if(i===path.length-1)ev.push({t:t0+i*2,type:"deliver",p:p,node:path[i]});
  }
 }
 ev=ev.map(function(e,i){return{e:e,i:i}}).sort(function(x,y){return x.e.t-y.e.t||x.i-y.i}).map(function(x){return x.e});
 return{nodes:nodes,edges:edges,events:ev,__demo:1};
}

// Centered Organic Layout with Strong Anti-Overlap Repulsion
function layoutNodes(nodes, edges){
 var N = nodes.length;
 if(!N) return;
 var hasCoords = nodes.every(function(n){ return typeof n.x==="number" && typeof n.y==="number"; });
 if(hasCoords) return;

 var golden = Math.PI * (3 - Math.sqrt(5));
 for(var i=0; i<N; i++){
  var r = 0.06 + 0.22 * Math.sqrt((i + 1) / N);
  var theta = i * golden;
  nodes[i].x = 0.5 + r * Math.cos(theta);
  nodes[i].y = 0.5 + r * Math.sin(theta);
 }

 var iters = Math.max(140, 50 + N * 3);
 var minDist = Math.max(0.09, 0.75 / Math.sqrt(N));
 var targetDist = Math.max(0.14, 0.95 / Math.sqrt(N));

 for(var s=0; s<iters; s++){
  var temp = 1 - (s / iters);
  var fx = new Float32Array(N), fy = new Float32Array(N);

  for(var i=0; i<N; i++){
   fx[i] -= (nodes[i].x - 0.5) * 0.22;
   fy[i] -= (nodes[i].y - 0.5) * 0.22;
  }

  for(var i=0; i<N; i++){
   for(var j=i+1; j<N; j++){
    var dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
    var d = Math.hypot(dx, dy) || 0.001;
    var rep = (0.016 / (d * d));
    if(d < minDist){
     rep += (minDist - d) * 1.8;
    }
    rep = Math.min(rep, 0.14) * temp;
    fx[i] += (dx/d)*rep; fy[i] += (dy/d)*rep;
    fx[j] -= (dx/d)*rep; fy[j] -= (dy/d)*rep;
   }
  }

  if(edges){
   for(var k=0; k<edges.length; k++){
    var u = edges[k][0], v = edges[k][1];
    if(u < N && v < N){
     var dx = nodes[v].x - nodes[u].x, dy = nodes[v].y - nodes[u].y;
     var d = Math.hypot(dx, dy) || 0.001;
     var spr = (d - targetDist) * 0.08 * temp;
     fx[u] += (dx/d)*spr; fy[u] += (dy/d)*spr;
     fx[v] -= (dx/d)*spr; fy[v] -= (dy/d)*spr;
    }
   }
  }

  for(var i=0; i<N; i++){
   nodes[i].x += fx[i] * 0.35;
   nodes[i].y += fy[i] * 0.35;
  }
 }

 var minX=1, maxX=0, minY=1, maxY=0;
 for(var i=0; i<N; i++){
  minX = Math.min(minX, nodes[i].x); maxX = Math.max(maxX, nodes[i].x);
  minY = Math.min(minY, nodes[i].y); maxY = Math.max(maxY, nodes[i].y);
 }
 var spanX = Math.max(0.01, maxX - minX);
 var spanY = Math.max(0.01, maxY - minY);
 var scale = Math.min(0.72 / spanX, 0.68 / spanY, 1.3);
 var midX = (minX + maxX) / 2;
 var midY = (minY + maxY) / 2;

 for(var i=0; i<N; i++){
  nodes[i].x = 0.5 + (nodes[i].x - midX) * scale;
  nodes[i].y = 0.5 + (nodes[i].y - midY) * scale;
 }
}

function parseTraceData(raw){
 var parsed = null;
 if(typeof raw === "object" && raw !== null && Array.isArray(raw.nodes) && Array.isArray(raw.events)){
  parsed = raw;
 } else {
  var text = (typeof raw === "string" ? raw : "").trim();
  if(!text) return null;
  try {
   var obj = JSON.parse(text);
   if(obj && Array.isArray(obj.nodes) && Array.isArray(obj.events)) parsed = obj;
  } catch(e){}

  if(!parsed){
   var lines = text.split("\n");
   var nodes = [], edges = [], events = [];
   for(var i=0; i<lines.length; i++){
    var line = lines[i].trim();
    if(!line) continue;
    try {
     var ev = JSON.parse(line);
     if(ev.type === "GRAPH_INIT"){
      if(Array.isArray(ev.nodes)){
       nodes = ev.nodes.map(function(n, idx){
        return (typeof n === "object" && n !== null) ? n : { id: n != null ? n : idx };
       });
      }
      if(Array.isArray(ev.edges)){
       edges = ev.edges.map(function(e){ return Array.isArray(e) ? e : [e.from, e.to]; });
      }
     } else if(ev.type === "spawn" || ev.type === "PACKET_CREATED"){
      events.push({ t: ev.t != null ? ev.t : (ev.time || 0), type: "spawn", p: ev.p != null ? ev.p : ev.id, node: ev.node != null ? ev.node : ev.start });
     } else if(ev.type === "hop" || ev.type === "PACKET_MOVED"){
      events.push({ t: ev.t != null ? ev.t : (ev.time || 0), type: "hop", p: ev.p != null ? ev.p : ev.id, from: ev.from, to: ev.to });
     } else if(ev.type === "deliver" || ev.type === "PACKET_DELIVERED"){
      events.push({ t: ev.t != null ? ev.t : (ev.time || 0), type: "deliver", p: ev.p != null ? ev.p : ev.id, node: ev.node != null ? ev.node : (ev.end != null ? ev.end : ev.at) });
     } else if(ev.type === "drop" || ev.type === "PACKET_DROPPED"){

function load(t,msg){

 lastChange = performance.now();

 var currentSimTime = 0;

 for(var fi = 0; fi < frameIdx; fi++){
  var fr = trace.timeFrames[fi];
  currentSimTime = fr.t;
  for(var ei = 0; ei < fr.events.length; ei++){
   var e = fr.events[ei];
   var o = S[e.p] || (S[e.p] = { id: e.p, path: [], status: "live" });
   if(e.type === "spawn"){
    o.path = [e.node];
    o.at = e.node;
    o.from = null;
    o.status = "live";
    o.activeFrame = fi;
   } else if(e.type === "hop"){
    if(!o.path || o.path.length === 0) o.path = [e.from];
    o.path.push(e.to);
    o.from = e.from;
    o.at = e.to;
    o.status = "live";
    o.activeFrame = fi;
   } else {
    o.status = e.type;
    o.activeFrame = fi;
   }
  }
 }

 var fl = 0, de = 0, dr = 0;
 for(var k in S){
  var s = S[k].status;
  if(s === "live") fl++;
  else if(s === "deliver") de++;
  else if(s === "drop") dr++;
 }

 $("#sTime").textContent = currentSimTime;
 $("#sFlight").textContent = fl;
 $("#sDel").textContent = de;

  html += renderGroupedCard(trace.timeFrames[j]);

}

   ctx.beginPath();
   ctx.arc(pos[0], pos[1], 4.5, 0, Math.PI * 2);
   ctx.fillStyle = getPacketColor(o.id, 1.0);
   ctx.fill();

   ctx.fillStyle = getPacketColor(o.id, isHovered ? 1.0 : 0.88);

 }

 ctx.font = '12px "Schibsted Grotesk",system-ui,sans-serif';
 ctx.textAlign = "center";
 trace.nodes.forEach(function(o, i){

function hlist(rows,f){
 if(!rows.length)return NONE;
 var m=Math.max.apply(0,rows.map(function(r){return r.v}))||1;
 return rows.map(function(r){
  var cls = r.me ? " me" : (r.upcoming ? " upcoming" : "");
  return'<div class="hb'+cls+'"><span>'+r.k+'</span><i style="width:'+(r.v/m*100).toFixed(1)+'%"></i><b>'+f(r.v)+'</b></div>';
 }).join("");
}

var KPIS=[
 ["delivery_rate","Delivery rate",function(A){return A.total?pct(A.delivered/A.total):"–"}],
 ["avg_latency","Average latency, time units",function(A){return A.delivered?fx(A.avgLat):"–"}],
 ["p95_latency","95th percentile latency",function(A){return A.delivered?fx(A.p95):"–"}],
 ["avg_hops","Average hops",function(A){return A.delivered?fx(A.avgHops):"–"}],
 ["dropped","Dropped packets",function(A){return A.dropped}],
 ["throughput","Packets delivered per time unit",function(A){return fx(A.thr)}]
];

function tr(M,key,name,unit){
 var T=M.training||{};
 return line([{n:name,c:"--acc",x:T.episodes||[],y:T[key]||[]}],{w:280,h:120});
}

function policy(M,key,f){
 return hlist((M.baselines||[]).map(function(b){
  return {
   k: b.name + (b.status === "Upcoming" ? " (Future)" : ""),
   v: b[key],
   me: /rl|q|agent/i.test(b.name) && b.status !== "Upcoming",
   upcoming: b.status === "Upcoming"
  };
 }),f);
}

var PANELS=[
 {id:"latency",g:"Routing performance",s:12,t:"Packet latency over time",src:"trace.events: deliver.t - spawn.t",
  d:function(A){var x=A.D.map(function(p){return p.t1});return line([{n:"Per packet",c:"--mute",x:x,y:A.lat},{n:"Running average",c:"--acc",x:x,y:A.run}])}},
 {id:"outcomes",g:"Routing performance",s:6,t:"Delivered and dropped, cumulative",src:"trace.events: deliver | drop",
  d:function(A){return line([{n:"Delivered",c:"--good",x:A.out.x,y:A.out.d},{n:"Dropped",c:"--bad",x:A.out.x,y:A.out.r}])}},
 {id:"hops",g:"Routing performance",s:6,t:"Hops per delivered packet",src:"trace.events: count of hop",
  d:function(A){return bars(A.hist,A.hist.map(function(_,i){return i+1}))}},
 
 {id:"reward",g:"Training dynamics",s:3,t:"Episode reward curve",src:"metrics.training.reward[]",d:function(A,M){return tr(M,"reward","Reward")}},
 {id:"loss",g:"Training dynamics",s:3,t:"Loss / TD-error",src:"metrics.training.loss[]",d:function(A,M){return tr(M,"loss","Loss")}},
 {id:"epsilon",g:"Training dynamics",s:3,t:"Exploration rate (ε)",src:"metrics.training.epsilon[]",d:function(A,M){return tr(M,"epsilon","Epsilon")}},
 {id:"q",g:"Training dynamics",s:3,t:"Mean Q-value",src:"metrics.training.q_mean[]",d:function(A,M){return tr(M,"q_mean","Mean Q")}},
 
 {id:"cmp-delivery",g:"Bot policy comparison",s:6,t:"Delivery rate across bot architectures",src:"metrics.baselines[].delivery_rate",d:function(A,M){return policy(M,"delivery_rate",pct)}},
 {id:"cmp-latency",g:"Bot policy comparison",s:6,t:"Average latency across bot architectures",src:"metrics.baselines[].avg_latency",d:function(A,M){return policy(M,"avg_latency",fx)}},
 
 {id:"node-load",g:"Network load & bottlenecks",s:6,t:"Packets handled by each node",src:"trace.events: hop.to",d:function(A){return hlist(A.nodes,String)}},
 {id:"link-use",g:"Network load & bottlenecks",s:6,t:"Busiest links (top utilization)",src:"trace.events: hop.from - hop.to",d:function(A){return hlist(A.links,String)}},
 
 {id:"packets",g:"Packet trajectory details",s:12,t:"All packet traces & statuses",src:"trace.events grouped by packet ID",
  d:function(A){
   var S={deliver:"Delivered",drop:"Dropped",live:"In flight"};
   return'<div class="tw"><table><thead><tr><th>Packet</th><th>Route Traversed</th><th>Latency</th><th>Hops</th><th>Status</th></tr></thead><tbody>'+
   A.all.map(function(p){
    return'<tr><td><b>P'+p.id+'</b></td><td>'+p.path.map(A.lab).join(" → ")+'</td><td>'+(p.lat!=null?p.lat+" ticks":"–")+'</td><td>'+p.hops+'</td><td class="'+p.status+'">'+S[p.status]+'</td></tr>';
   }).join("")+'</tbody></table></div>';
  }}
];

var CONTRACT='<section class="group"><h3>Data contract & Schema<span class="sub">JSON specifications for simulation replay and bot evaluation</span></h3><pre>'+[
 'trace.json    drives Replay and every trace-derived panel',
 '  nodes       [{ id, x, y, label? }]          x, y normalised 0 to 1',
 '  edges       [[from, to]]',
 '  events      [{ t, type, p, node?, from?, to? }]',
 '              type: spawn | hop | deliver | drop',
 '',
 'metrics.json  drives Training dynamics and Multi-Bot comparison',
 '  training    { episodes[], reward[], loss[], epsilon[], q_mean[] }',
 '  baselines   [{ name, delivery_rate, avg_latency, avg_hops, status? }]',
 '',
 'Extend newer bots by appending entries into metrics.baselines array.'].join("\n")+'</pre></section>';

function render(){
 var T=trace||(sampleTrace=sampleTrace||makeDemo()),A=analyze(T);
 if(metricsSample) metrics=makeSampleMetrics(A);
 var gs=[],by={};
 PANELS.forEach(function(p){
  if(!by[p.g]){by[p.g]=[];gs.push(p.g);}
  by[p.g].push(p);
 });

 $("#an").innerHTML=
  '<div class="an-head"><h2>Performance Analytics & Model Evaluation</h2>'+
  '<div class="src"><span>Trace: '+(trace&&!traceDemo?"loaded trace.json":"built-in demo")+'</span>'+
  '<span>Metrics: '+(metricsSample?"live simulation estimates":"loaded metrics.json")+'</span>'+
  (anErr?'<span style="color:var(--bad)">'+anErr+'</span>':"")+'</div></div>'+
  '<div class="kpis">'+KPIS.map(function(k){return'<div class="stat" data-metric="'+k[0]+'"><b>'+k[2](A)+'</b><small>'+k[1]+'</small></div>'}).join("")+'</div>'+
  gs.map(function(g){
   return'<section class="group"><h3>'+g+'</h3><div class="grid">'+by[g].map(function(p){
    return'<article class="panel s'+p.s+'" data-panel="'+p.id+'"><div class="ph"><h4>'+p.t+'</h4><code>'+p.src+'</code></div>'+p.d(A,metrics)+'</article>';
   }).join("")+'</div></section>';
  }).join("")+CONTRACT;
}

function setView(v){
 view=v;
 $(".app").dataset.view=v;
 $("#tabR").setAttribute("aria-selected",v==="replay");
 $("#tabA").setAttribute("aria-selected",v==="analytics");
 $("#demo").hidden=v!=="replay";
 $("#upload").hidden=v!=="replay";
 $("#mbtn").hidden=v!=="analytics";
 if(v==="analytics"){
  pause();
  render();
 }
}

$("#tabR").onclick=function(){setView("replay")};
$("#tabA").onclick=function(){setView("analytics")};
$("#mbtn").onclick=function(){$("#mfile").click()};
$("#mfile").onchange=function(e){
 var f=e.target.files[0];
 if(!f) return;
 var rd=new FileReader();
 rd.onload=function(){
  try{
   metrics=JSON.parse(rd.result);
   metricsSample=false;
   anErr="";
  }catch(x){
   anErr="Couldn’t read that metrics file as JSON.";
  }
  render();
 };
 rd.readAsText(f);
};

</script>
</body>
</html>
